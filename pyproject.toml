[project]
name = "gradse"
version = "0.1.0"
description = "State estimation codes using Jax for MLE"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["jax[cpu]>=0.6.1", "rich", "pandas", "pyaml"]

[tool.basedpyright]
typeCheckingMode = "standard"
reportIgnoreCommentWithoutRule = false
reportConstantRedefinition = false

[tool.ruff.format]
docstring-code-format = true  # Formats code in docstrings

# If you plan a src/ layout later, this keeps installs sane even without code yet
[tool.setuptools]
package-dir = {"" = "src"}
